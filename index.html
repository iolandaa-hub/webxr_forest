<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning WebXR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

<script>
// ================= TREE DATA =================
const treeData = {
  mango: {
    name: "Mango Tree",
    info: "Native to South Asia. Produces edible mango fruits. Can live over 100 years in warm tropical climates."
  },
  pine: {
    name: "Pine Tree",
    info: "Evergreen conifer found in colder regions. Can live 100–1000 years depending on species. Produces pine cones."
  },
  birch: {
    name: "PSX Birch Tree",
    info: "A stylized birch tree often found in game environments. Real birch trees grow in temperate climates and are known for white bark and fast growth."
  }
};
</script>

<a-scene>

  <!-- CAMERA -->
  <a-entity camera look-controls>
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-entity>

  <!-- SKY -->
  <a-sky color="#bfe7ff"></a-sky>

  <!-- LIGHTS -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="5 10 5"></a-light>

  <!-- GROUND -->
  <a-plane
    rotation="-90 0 0"
    width="60"
    height="60"
    color="#3c8d3f">
  </a-plane>

  <!-- ================= TREES ================= -->

  <!-- MANGO TREE -->
  <a-entity
    class="clickable"
    id="mango"
    gltf-model="assets/mango_tree.glb"
    position="-4 0 -6"
    scale="1.2 1.2 1.2"
    event-set__enter="_event: mouseenter; scale: 1.4 1.4 1.4"
    event-set__leave="_event: mouseleave; scale: 1.2 1.2 1.2">
  </a-entity>

  <!-- PINE TREE -->
  <a-entity
    class="clickable"
    id="pine"
    gltf-model="assets/pine_tree.glb"
    position="0 0 -6"
    scale="1.2 1.2 1.2"
    event-set__enter="_event: mouseenter; scale: 1.4 1.4 1.4"
    event-set__leave="_event: mouseleave; scale: 1.2 1.2 1.2">
  </a-entity>

  <!-- BIRCH TREE -->
  <a-entity
    class="clickable"
    id="birch"
    gltf-model="assets/psx_birch_tree.glb"
    position="4 0 -6"
    scale="1.2 1.2 1.2"
    event-set__enter="_event: mouseenter; scale: 1.4 1.4 1.4"
    event-set__leave="_event: mouseleave; scale: 1.2 1.2 1.2">
  </a-entity>

  <!-- ================= HOVER LABEL ================= -->
  <a-entity id="hoverLabel" visible="false" position="0 2 -3">
    <a-plane width="2.5" height="0.6" color="#111" opacity="0.85"></a-plane>
    <a-text id="hoverText"
      value=""
      align="center"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

  <!-- ================= INFO BOX ================= -->
  <a-entity id="infoBox" visible="false" position="0 1.5 -2">
    <a-plane width="3.5" height="2" color="#000" opacity="0.9"></a-plane>
    <a-text id="infoText"
      value=""
      align="center"
      wrap-count="32"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

</a-scene>

<script>
// ================= UI ELEMENTS =================
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");

const infoBox = document.querySelector("#infoBox");
const infoText = document.querySelector("#infoText");

// ================= INTERACTION =================
document.querySelectorAll(".clickable").forEach(el => {

  // HOVER
  el.addEventListener("mouseenter", () => {
    const id = el.id;

    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[id].name);
  });

  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  // CLICK
  el.addEventListener("click", () => {
    const id = el.id;

    infoBox.setAttribute("visible", true);
    infoText.setAttribute(
      "value",
      treeData[id].name + "\n\n" + treeData[id].info
    );
  });

});
</script>

</body>
</html>
