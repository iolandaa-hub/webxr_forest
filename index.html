<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning WebXR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body>

<script>
// ================= TREE DATA =================
const treeData = {
  conifer: {
    name: "Conifer Tree",
    info: "Evergreen tree found in cold and temperate regions. Produces cones and lives for hundreds of years."
  },
  pine: {
    name: "Pine Tree",
    info: "Pine trees are conifers with long needles. They are widely used for timber and can live for centuries."
  }
};

// ================= MODEL DEBUG COMPONENT =================
AFRAME.registerComponent('model-debug', {
  init: function () {
    const el = this.el;

    el.addEventListener('model-loaded', () => {
      console.log("✅ LOADED:", el.getAttribute('gltf-model'));
    });

    el.addEventListener('model-error', (e) => {
      console.error("❌ FAILED TO LOAD:", el.getAttribute('gltf-model'), e);
    });
  }
});
</script>

<a-scene fog="type: linear; color: #bfe7ff; near: 5; far: 25">

  <!-- CAMERA -->
  <a-entity camera look-controls>
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-entity>

  <!-- SKY -->
  <a-sky color="#cfefff"></a-sky>

  <!-- LIGHTING -->
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" position="5 10 5" intensity="1.5"></a-light>

  <!-- GROUND -->
  <a-plane
    rotation="-90 0 0"
    width="60"
    height="60"
    color="#3d8b3d">
  </a-plane>

  <!-- ================= TREES ================= -->

 <!-- CONIFER -->
<a-entity
  class="clickable"
  id="conifer"
  gltf-model="conifer.glb"
  position="-1.5 0 -4"
  scale="0.03 0.03 0.03">
</a-entity>

<!-- PINE -->
<a-entity
  class="clickable"
  id="pine"
  gltf-model="pine_tree.glb"
  position="1.5 0 -4"
  scale="0.02 0.02 0.02">
</a-entity>

  <!-- ================= HOVER LABEL ================= -->
  <a-entity id="hoverLabel" visible="false" position="0 2 -3">
    <a-plane width="2.5" height="0.6" color="#111" opacity="0.85"></a-plane>
    <a-text id="hoverText"
      value=""
      align="center"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

  <!-- ================= INFO BOX ================= -->
  <a-entity id="infoBox" visible="false" position="0 1.5 -2">
    <a-plane width="3.5" height="2" color="#000" opacity="0.9"></a-plane>
    <a-text id="infoText"
      value=""
      align="center"
      wrap-count="32"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

</a-scene>

<script>

// ================= UI =================
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");

const infoBox = document.querySelector("#infoBox");
const infoText = document.querySelector("#infoText");

// ================= INTERACTIONS =================
document.querySelectorAll(".clickable").forEach(el => {

  // HOVER
  el.addEventListener("mouseenter", () => {
    const id = el.id;
    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[id].name);
  });

  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  // CLICK
  el.addEventListener("click", () => {
    const id = el.id;

    infoBox.setAttribute("visible", true);
    infoText.setAttribute(
      "value",
      treeData[id].name + "\n\n" + treeData[id].info
    );
  });

});

</script>

</body>
</html>
