<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning WebXR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body>

<script>
// ================= TREE INFO =================
const treeData = {
  bamboo: {
    name: "Bamboo",
    info: "Fast-growing grass from Asia. Some species grow extremely quickly and are used in construction."
  },
  date_palm: {
    name: "Date Palm",
    info: "Desert tree producing dates. Common in hot climates and can live over 100 years."
  },
  beech_tree: {
    name: "Beech Tree",
    info: "Large European forest tree. Known for smooth bark and dense canopy."
  }
};

// ================= DEBUG =================
AFRAME.registerComponent('model-debug', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      console.log("LOADED:", this.el.getAttribute('gltf-model'));
    });

    this.el.addEventListener('model-error', () => {
      console.error("FAILED:", this.el.getAttribute('gltf-model'));
    });
  }
});
</script>

<a-scene fog="type: linear; color: #cfefff; near: 2; far: 12">

  <!-- CAMERA -->
  <a-camera position="0 1.2 1.5" look-controls>
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-camera>

  <!-- SKY -->
 <a-sky
  src="https://cdn.polyhaven.com/asset_img/primary/grasslands_sunset.png?height=760&quality=95"
  rotation="0 -90 0">
</a-sky>

  <!-- LIGHT -->
  <a-light type="ambient" intensity="1.3"></a-light>
  <a-light type="directional" position="2 5 2" intensity="1.2"></a-light>

  <!-- GROUND -->
  <a-plane
    rotation="-90 0 0"
    width="30"
    height="30"
    color="#3d8b3d">
  </a-plane>

  <!-- ================= TREES ================= -->

  <!-- BAMBOO -->
  <a-entity
    class="clickable"
    id="bamboo"
    gltf-model="bamboo.glb"
    position="-0.8 0 -2"
    scale="0.2 0.2 0.2"
    model-debug>
  </a-entity>

  <!-- DATE PALM -->
  <a-entity
    class="clickable"
    id="date_palm"
    gltf-model="date_palm.glb"
    position="0 0 -2"
    scale="0.2 0.2 0.2"
    model-debug>
  </a-entity>

  <!-- BEECH TREE -->
  <a-entity
    class="clickable"
    id="beech_tree"
    gltf-model="beech_tree.glb"
    position="0.8 0 -2"
    scale="0.2 0.2 0.2"
    model-debug>
  </a-entity>

  <!-- ================= MODERN HOVER LABEL ================= -->
  <a-entity id="hoverLabel" visible="false" position="0 2 -1.5">

    <!-- background -->
    <a-plane width="2.6" height="0.7" color="#111827" opacity="0.75"></a-plane>

    <!-- subtle glow layer -->
    <a-plane width="2.7" height="0.8" color="#38bdf8" opacity="0.12"></a-plane>

    <a-text
      id="hoverText"
      value=""
      align="center"
      color="#ffffff"
      position="0 0 0.01"
      width="3">
    </a-text>

  </a-entity>

  <!-- ================= MODERN INFO BOX ================= -->
  <a-entity id="infoBox" visible="false" position="0 1.4 -1.2">

    <!-- main card -->
    <a-plane width="4" height="2.3" color="#0f172a" opacity="0.88"></a-plane>

    <!-- glow border -->
    <a-plane width="4.1" height="2.4" color="#22c55e" opacity="0.10"></a-plane>

    <!-- title -->
    <a-text
      id="infoTitle"
      value=""
      align="center"
      color="#ffffff"
      position="0 0.75 0.01"
      width="4">
    </a-text>

    <!-- body -->
    <a-text
      id="infoText"
      value=""
      align="center"
      color="#cbd5e1"
      position="0 -0.2 0.01"
      wrap-count="38"
      width="3.8">
    </a-text>

  </a-entity>

</a-scene>

<script>

// ================= UI =================
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");

const infoBox = document.querySelector("#infoBox");
const infoTitle = document.querySelector("#infoTitle");
const infoText = document.querySelector("#infoText");

// ================= INTERACTIONS =================
document.querySelectorAll(".clickable").forEach(el => {

  el.addEventListener("mouseenter", () => {
    const id = el.id;
    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[id].name);
  });

  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  el.addEventListener("click", () => {
    const id = el.id;

    infoBox.setAttribute("visible", true);
    infoTitle.setAttribute("value", treeData[id].name);
    infoText.setAttribute("value", treeData[id].info);
  });

});

</script>

</body>
</html>
