<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning WebXR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body>

<script>
// ================= TREE DATA =================
const treeData = {
  quiver: {
    name: "Quiver Tree",
    info: "Native to Southern Africa. Can live over 100 years. Stores water in trunk to survive dry climates."
  },
  island_tree: {
    name: "Island Tree",
    info: "Found in tropical islands. Adapted to salty air and strong winds. Lifespan varies between 30–80 years."
  },
  jacaranda: {
    name: "Jacaranda Tree",
    info: "Native to South America. Known for its purple-blue flowers. Can live up to 50 years."
  }
};
</script>

<a-scene>

  <!-- CAMERA -->
  <a-entity camera look-controls>
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-entity>

  <!-- SKY (placeholder HDRI) -->
  <a-sky color="#a3d5ff"></a-sky>

  <!-- LIGHTS -->
  <a-light type="ambient" intensity="0.8"></a-light>
  <a-light type="directional" position="5 10 5"></a-light>

  <!-- GROUND -->
  <a-plane
    rotation="-90 0 0"
    width="50"
    height="50"
    color="#3a7d44">
  </a-plane>

  <!-- ================= TREES ================= -->

  <!-- QUIVER -->
  <a-entity
    class="clickable"
    id="quiver"
    gltf-model="assets/quiver_tree_02_4k-gltf"
    position="-3 0 -5"
    scale="1 1 1"
    event-set__enter="_event: mouseenter; scale: 1.2 1.2 1.2"
    event-set__leave="_event: mouseleave; scale: 1 1 1">
  </a-entity>

  <!-- ISLAND TREE -->
  <a-entity
    class="clickable"
    id="island_tree"
    gltf-model="assets/island_tree_02_4k.gltf"
    position="0 0 -5"
    scale="1 1 1"
    event-set__enter="_event: mouseenter; scale: 1.2 1.2 1.2"
    event-set__leave="_event: mouseleave; scale: 1 1 1">
  </a-entity>

  <!-- JACARANDA -->
  <a-entity
    class="clickable"
    id="jacaranda"
    gltf-model="assets/jakaranda_tree_4k.gltf"
    position="3 0 -5"
    scale="1 1 1"
    event-set__enter="_event: mouseenter; scale: 1.2 1.2 1.2"
    event-set__leave="_event: mouseleave; scale: 1 1 1">
  </a-entity>

  <!-- ================= HOVER LABEL ================= -->
  <a-entity id="hoverLabel" visible="false" position="0 2 -3">
    <a-plane width="2.5" height="0.6" color="#111" opacity="0.85"></a-plane>
    <a-text id="hoverText"
      value=""
      align="center"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

  <!-- ================= INFO BOX ================= -->
  <a-entity id="infoBox" visible="false" position="0 1.5 -2">
    <a-plane width="3" height="2" color="#000" opacity="0.9"></a-plane>
    <a-text id="infoText"
      value=""
      align="center"
      wrap-count="30"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

</a-scene>

<script>
// ================= UI ELEMENTS =================
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");

const infoBox = document.querySelector("#infoBox");
const infoText = document.querySelector("#infoText");

// ================= INTERACTION =================
document.querySelectorAll(".clickable").forEach(el => {

  // HOVER IN
  el.addEventListener("mouseenter", () => {
    const id = el.id;

    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[id].name);
  });

  // HOVER OUT
  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  // CLICK
  el.addEventListener("click", () => {
    const id = el.id;

    infoBox.setAttribute("visible", true);
    infoText.setAttribute(
      "value",
      treeData[id].name + "\n\n" + treeData[id].info
    );
  });

});
</script>

</body>
</html>
