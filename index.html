<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning Experience</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

<script>
// --- TREE DATA (info boxes) ---
const treeData = {
  jacaranda: {
    name: "Jacaranda Tree",
    info: "Native to South America. Known for purple-blue flowers. Can live up to 50 years.",
  },
  island_tree: {
    name: "Island Tree",
    info: "Found in tropical islands. Adapted to salty air and strong winds. Lifespan varies 30–80 years.",
  },
  quiver: {
    name: "Quiver Tree",
    info: "Native to Southern Africa. Can live over 100 years. Stores water in trunk for dry climates.",
  }
};
</script>

<a-scene>

  <!-- CAMERA + CURSOR -->
  <a-entity camera look-controls>
    <a-cursor 
      raycaster="objects: .clickable"
      fuse="false">
    </a-cursor>
  </a-entity>

  <!-- SKY (HDR placeholder) -->
  <a-sky src="assets/hdr.jpg" color="#88ccee"></a-sky>

  <!-- GROUND -->
  <a-plane 
    rotation="-90 0 0"
    width="50"
    height="50"
    src="assets/grass.jpg"
    repeat="10 10">
  </a-plane>

  <!-- LIGHTS -->
  <a-light type="ambient" intensity="0.7"></a-light>
  <a-light type="directional" position="5 10 5"></a-light>

  <!-- ================= TREES ================= -->

  <!-- JACARANDA -->
  <a-entity 
    class="clickable"
    id="jacaranda"
    gltf-model="assets/jacaranda.gltf"
    position="-3 0 -5"
    scale="1 1 1"
    event-set__enter="_event: mouseenter; scale: 1.2 1.2 1.2"
    event-set__leave="_event: mouseleave; scale: 1 1 1">
  </a-entity>

  <!-- ISLAND TREE -->
  <a-entity 
    class="clickable"
    id="island_tree"
    gltf-model="assets/island_tree.gltf"
    position="0 0 -5"
    scale="1 1 1"
    event-set__enter="_event: mouseenter; scale: 1.2 1.2 1.2"
    event-set__leave="_event: mouseleave; scale: 1 1 1">
  </a-entity>

  <!-- QUIVER -->
  <a-entity 
    class="clickable"
    id="quiver"
    gltf-model="assets/quiver.gltf"
    position="3 0 -5"
    scale="1 1 1"
    event-set__enter="_event: mouseenter; scale: 1.2 1.2 1.2"
    event-set__leave="_event: mouseleave; scale: 1 1 1">
  </a-entity>

  <!-- ================= UI: HOVER LABEL ================= -->
  <a-entity id="hoverLabel"
    visible="false"
    position="0 2 -3">
    <a-plane width="2.5" height="0.6" color="#222" opacity="0.8"></a-plane>
    <a-text id="hoverText"
      value=""
      align="center"
      color="white"
      position="0 0 0.01">
    </a-text>
  </a-entity>

  <!-- ================= UI: INFO BOX ================= -->
  <a-entity id="infoBox"
    visible="false"
    position="0 1.5 -2">
    <a-plane width="3" height="1.5" color="#111" opacity="0.9"></a-plane>
    <a-text id="infoText"
      value=""
      align="center"
      color="#ffffff"
      wrap-count="30"
      position="0 0 0.01">
    </a-text>
  </a-entity>

</a-scene>

<script>
// --- HOVER + CLICK LOGIC ---
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");
const infoBox = document.querySelector("#infoBox");
const infoText = document.querySelector("#infoText");

document.querySelectorAll(".clickable").forEach(el => {

  // HOVER IN
  el.addEventListener("mouseenter", () => {
    const id = el.id;
    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[id].name);
    hoverLabel.setAttribute("position", "0 2 -3");
  });

  // HOVER OUT
  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  // CLICK
  el.addEventListener("click", () => {
    const id = el.id;
    infoBox.setAttribute("visible", true);
    infoText.setAttribute("value",
      treeData[id].name + "\n\n" + treeData[id].info
    );
  });

});
</script>

</body>
</html>
