<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning WebXR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body>

<script>
// ================= TREE INFO =================
const treeData = {
  mango: {
    name: "Mango Tree",
    info: "Native to South Asia. Produces mango fruit. Can live over 100 years in tropical climates."
  },
  oak: {
    name: "Oak Tree",
    info: "Long-living hardwood tree found in temperate regions. Can live 200–1000 years depending on species."
  },
  pine: {
    name: "Pine Tree",
    info: "Evergreen conifer found in cold climates. Produces cones and can live hundreds of years."
  }
};
</script>

<a-scene fog="type: linear; color: #bfe7ff; near: 5; far: 25">

  <!-- CAMERA -->
  <a-entity camera look-controls>
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-entity>

  <!-- SKY -->
  <a-sky color="#cfefff"></a-sky>

  <!-- LIGHTING -->
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" position="5 10 5" intensity="1.5"></a-light>

  <!-- GROUND -->
  <a-plane
    rotation="-90 0 0"
    width="60"
    height="60"
    color="#3d8b3d">
  </a-plane>

  <!-- ================= TREES ================= -->

  <!-- MANGO -->
  <a-entity
    class="clickable"
    id="mango"
    gltf-model="mango_tree.glb"
    position="-4 0 -6"
    scale="0.2 0.2 0.2">
  </a-entity>

  <!-- OAK -->
  <a-entity
    class="clickable"
    id="oak"
    gltf-model="oak_tree.glb"
    position="0 0 -6"
    scale="0.2 0.2 0.2">
  </a-entity>

  <!-- PINE -->
  <a-entity
    class="clickable"
    id="pine"
    gltf-model="pine_tree.glb"
    position="4 0 -6"
    scale="0.2 0.2 0.2">
  </a-entity>

  <!-- ================= HOVER LABEL ================= -->
  <a-entity id="hoverLabel" visible="false" position="0 2 -3">
    <a-plane width="2.5" height="0.6" color="#111" opacity="0.85"></a-plane>
    <a-text id="hoverText"
      value=""
      align="center"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

  <!-- ================= INFO BOX ================= -->
  <a-entity id="infoBox" visible="false" position="0 1.5 -2">
    <a-plane width="3.5" height="2" color="#000" opacity="0.9"></a-plane>
    <a-text id="infoText"
      value=""
      align="center"
      wrap-count="32"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

</a-scene>

<script>
// ================= UI =================
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");

const infoBox = document.querySelector("#infoBox");
const infoText = document.querySelector("#infoText");

// ================= INTERACTION =================
document.querySelectorAll(".clickable").forEach(el => {

  el.addEventListener("mouseenter", () => {
    const id = el.id;
    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[id].name);
  });

  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  el.addEventListener("click", () => {
    const id = el.id;

    infoBox.setAttribute("visible", true);
    infoText.setAttribute(
      "value",
      treeData[id].name + "\n\n" + treeData[id].info
    );
  });

});
</script>

</body>
</html>
