<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning WebXR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body>

<script>
// ================= TREE INFO =================
const treeData = {
  bamboo: {
    name: "Bamboo",
    info: "Bamboo is a fast-growing grass found in Asia. Some species can grow over 1 meter per day and are widely used for construction and textiles."
  },
  date_palm: {
    name: "Date Palm",
    info: "Date palms are common in desert regions of the Middle East and North Africa. They produce sweet edible dates and can live over 100 years."
  },
  beech_tree: {
    name: "Beech Tree",
    info: "Beech trees are large deciduous trees found in temperate Europe. They can live up to 300 years and form dense, shaded forests."
  }
};

// ================= DEBUG COMPONENT =================
AFRAME.registerComponent('model-debug', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      console.log("✅ LOADED:", this.el.getAttribute('gltf-model'));
    });

    this.el.addEventListener('model-error', () => {
      console.error("❌ FAILED:", this.el.getAttribute('gltf-model'));
    });
  }
});
</script>

<a-scene fog="type: linear; color: #bfe7ff; near: 5; far: 25">

  <!-- CAMERA -->
  <a-entity camera look-controls>
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-entity>

  <!-- SKY -->
  <a-sky color="#cfefff"></a-sky>

  <!-- LIGHTING -->
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" position="5 10 5" intensity="1.5"></a-light>

  <!-- GROUND -->
  <a-plane
    rotation="-90 0 0"
    width="60"
    height="60"
    color="#3d8b3d">
  </a-plane>

  <!-- ================= TREES ================= -->

  <!-- BAMBOO -->
  <a-entity
    class="clickable"
    id="bamboo"
    gltf-model="bamboo.glb"
    position="-2 0 -4"
    scale="0.05 0.05 0.05"
    model-debug>
  </a-entity>

  <!-- DATE PALM -->
  <a-entity
    class="clickable"
    id="date_palm"
    gltf-model="date_palm.glb"
    position="0 0 -4"
    scale="0.05 0.05 0.05"
    model-debug>
  </a-entity>

  <!-- BEECH TREE -->
  <a-entity
    class="clickable"
    id="beech_tree"
    gltf-model="beech_tree.glb"
    position="2 0 -4"
    scale="0.05 0.05 0.05"
    model-debug>
  </a-entity>

  <!-- ================= HOVER LABEL ================= -->
  <a-entity id="hoverLabel" visible="false" position="0 2 -3">
    <a-plane width="2.5" height="0.6" color="#111" opacity="0.85"></a-plane>
    <a-text id="hoverText"
      value=""
      align="center"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

  <!-- ================= INFO BOX ================= -->
  <a-entity id="infoBox" visible="false" position="0 1.5 -2">
    <a-plane width="3.5" height="2" color="#000" opacity="0.9"></a-plane>
    <a-text id="infoText"
      value=""
      align="center"
      wrap-count="32"
      color="#ffffff"
      position="0 0 0.01">
    </a-text>
  </a-entity>

</a-scene>

<script>

// ================= UI =================
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");

const infoBox = document.querySelector("#infoBox");
const infoText = document.querySelector("#infoText");

// ================= INTERACTION =================
document.querySelectorAll(".clickable").forEach(el => {

  el.addEventListener("mouseenter", () => {
    const id = el.id;
    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[id].name);
  });

  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  el.addEventListener("click", () => {
    const id = el.id;

    infoBox.setAttribute("visible", true);
    infoText.setAttribute(
      "value",
      treeData[id].name + "\n\n" + treeData[id].info
    );
  });

});

</script>

</body>
</html>
