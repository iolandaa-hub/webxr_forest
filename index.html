<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tree Learning WebXR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body>

<script>
// ================= TREE INFO =================
const treeData = {
  bamboo: {
    name: "Bamboo",
    info: "Fast-growing grass from Asia. Some species grow extremely quickly and are used in construction."
  },
  date_palm: {
    name: "Date Palm",
    info: "Desert tree producing dates. Common in hot climates and can live over 100 years."
  },
  beech_tree: {
    name: "Beech Tree",
    info: "Large European forest tree. Known for smooth bark and dense canopy."
  }
};

// ================= DEBUG =================
AFRAME.registerComponent('model-debug', {
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      console.log("LOADED:", this.el.getAttribute('gltf-model'));
    });
    this.el.addEventListener('model-error', () => {
      console.error("FAILED:", this.el.getAttribute('gltf-model'));
    });
  }
});

// ================= WIND =================
AFRAME.registerComponent('wind-sway', {
  schema: { strength: { default: 0.05 } },
  tick: function (t) {
    this.el.object3D.rotation.z =
      Math.sin(t / 1000) * this.data.strength;
  }
});
</script>

<a-scene>

  <!-- 🌅 SKY (your image used correctly) -->
  <a-sky src="https://cdn.polyhaven.com/asset_img/primary/grasslands_sunset.png?height=760&quality=95"></a-sky>

  <!-- 🌿 GROUND (to match grasslands feel) -->
  <a-plane
    rotation="-90 0 0"
    width="50"
    height="50"
    color="#7fbf6a"
    material="roughness: 1; metalness: 0">
  </a-plane>

  <!-- 📷 CAMERA (fixed height) -->
  <a-camera position="0 0 0" look-controls>
    <a-cursor raycaster="objects: .clickable"></a-cursor>
  </a-camera>

  <!-- 💡 LIGHT -->
  <a-light type="ambient" intensity="1.2"></a-light>

  <!-- 🌲 TREES -->

  <a-entity
    class="clickable"
    id="bamboo"
    gltf-model="bamboo.glb"
    position="-0.8 0 -2"
    scale="0.25 0.25 0.25"
    model-debug
    wind-sway="strength: 0.03">
  </a-entity>

  <a-entity
    class="clickable"
    id="date_palm"
    gltf-model="date_palm.glb"
    position="0 0 -2"
    scale="0.25 0.25 0.25"
    model-debug
    wind-sway="strength: 0.02">
  </a-entity>

  <a-entity
    class="clickable"
    id="beech_tree"
    gltf-model="beech_tree.glb"
    position="0.8 0 -2"
    scale="0.25 0.25 0.25"
    model-debug
    wind-sway="strength: 0.04">
  </a-entity>

  <!-- 💬 HOVER LABEL -->
  <a-entity id="hoverLabel" visible="false" position="0 2 -1.5">

    <a-plane width="2.6" height="0.7" color="#111827" opacity="0.75"></a-plane>

    <a-text
      id="hoverText"
      value=""
      align="center"
      color="#ffffff"
      position="0 0 0.01"
      width="3">
    </a-text>

  </a-entity>

  <!-- 📦 INFO PANEL -->
  <a-entity id="infoBox" visible="false" position="0 1.4 -1.2">

    <a-plane width="4" height="2.3" color="#0f172a" opacity="0.9"></a-plane>

    <a-text
      id="infoTitle"
      value=""
      align="center"
      color="#ffffff"
      position="0 0.75 0.01"
      width="4">
    </a-text>

    <a-text
      id="infoText"
      value=""
      align="center"
      color="#cbd5e1"
      position="0 -0.2 0.01"
      wrap-count="38"
      width="3.8">
    </a-text>

  </a-entity>

</a-scene>

<script>

// ================= UI =================
const hoverLabel = document.querySelector("#hoverLabel");
const hoverText = document.querySelector("#hoverText");

const infoBox = document.querySelector("#infoBox");
const infoTitle = document.querySelector("#infoTitle");
const infoText = document.querySelector("#infoText");

// CLOSE ON BACKGROUND CLICK
document.querySelector("a-scene").addEventListener("click", (e) => {
  if (e.target.tagName === "CANVAS") {
    infoBox.setAttribute("visible", false);
  }
});

// INTERACTIONS
document.querySelectorAll(".clickable").forEach(el => {

  el.addEventListener("mouseenter", () => {
    hoverLabel.setAttribute("visible", true);
    hoverText.setAttribute("value", treeData[el.id].name);
  });

  el.addEventListener("mouseleave", () => {
    hoverLabel.setAttribute("visible", false);
  });

  el.addEventListener("click", () => {
    infoBox.setAttribute("visible", true);
    infoTitle.setAttribute("value", treeData[el.id].name);
    infoText.setAttribute("value", treeData[el.id].info);
  });

});

</script>

</body>
</html>
